name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Crear 404.html para rutas de Angular
        run: cp dist/app-angular/browser/index.html dist/app-angular/browser/404.html

      - name: Subir artefacto de Angular
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/app-angular/browser' 

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
